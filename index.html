<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly-in · Visualizador</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <p class="eyebrow">FLY-IN / SIMULATION VIEWER</p>
          <h1>Ruta de drones</h1>
        </div>
        <p id="status" class="status" aria-live="polite">Carga un mapa para comenzar.</p>
      </header>

      <section class="workspace">
        <aside class="control-panel">
          <label class="file-label" for="map-file">Archivo de mapa <input id="map-file" type="file" accept=".txt,text/plain" /></label>
          <p class="help">Selecciona un archivo <code>.txt</code> con el formato Fly-in.</p>

          <label for="solution-input">Solución (un turno por línea)</label>
          <textarea id="solution-input" spellcheck="false" placeholder="D1-waypoint1 D2-waypoint1&#10;D1-waypoint2&#10;D1-goal D2-waypoint2"></textarea>
          <button id="load-solution">Visualizar solución</button>
          <p class="help">Formato: <code>D&lt;id&gt;-&lt;destino&gt;</code>. Un drone ausente de una línea espera ese turno.</p>
        </aside>

        <section class="visual-panel" aria-label="Grafo de hubs">
          <div class="graph-toolbar">
            <div><span id="turn-label">Turno 0</span><span id="turn-total">de 0</span></div>
            <div id="map-summary"></div>
          </div>
          <div id="graph-wrap"><svg id="graph" role="img" aria-label="Grafo de hubs y drones"></svg></div>
          <div id="legend" class="legend"></div>
        </section>
      </section>

      <section class="timeline-panel">
        <div class="playback">
          <button id="first-turn" class="icon-button" title="Primer turno">|◀</button>
          <button id="previous-turn" class="icon-button" title="Turno anterior">◀</button>
          <button id="play-pause" class="play-button">▶ Reproducir</button>
          <button id="next-turn" class="icon-button" title="Turno siguiente">▶</button>
          <button id="last-turn" class="icon-button" title="Último turno">▶|</button>
          <input id="turn-slider" type="range" min="0" max="0" value="0" aria-label="Seleccionar turno" />
        </div>
        <ol id="turn-list" class="turn-list" aria-label="Lista de turnos"></ol>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
